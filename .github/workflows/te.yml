name: 失败书源重写

# 读一份失败书源清单，逐条重检；规则过时的、地址写坏的，自动重建规则救回来。
# 救回来的进 有效书源_重写_N条.json，救不回来的连同最新诊断进 仍失败_N条.json。

on:
  workflow_dispatch:
    inputs:
      src:
        description: '失败书源文件路径（可多个，空格分隔）'
        required: false
        default: 'dist/失败书源_1434条.json'
      workers:
        description: '并发线程数（默认 16）'
        required: false
        default: '16'
      timeout:
        description: '单请求超时秒数（默认 8）'
        required: false
        default: '8'
      budget:
        description: '单条重写时间预算秒数（默认 25）'
        required: false
        default: '25'
      commit_result:
        description: '结果提交回仓库？（true / false）'
        required: false
        default: 'true'

  # 仓库里的失败书源更新后自动跑
  push:
    paths:
      - 'dist/失败书源_*.json'
      - 'fix_failed.py'
      - 'bscheck/**'
      - '.github/workflows/rewrite.yml'

permissions:
  contents: write

concurrency:
  group: booksource-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 自检规则引擎
        run: python selftest.py

      - name: 重写失败书源
        run: |
          SRC="${{ github.event.inputs.src }}"
          if [ -z "$SRC" ]; then SRC="dist/失败书源_1434条.json"; fi
          echo "输入：$SRC"
          python fix_failed.py \
            --src $SRC \
            --out dist_rewrite \
            --workers ${{ github.event.inputs.workers || '16' }} \
            --timeout ${{ github.event.inputs.timeout || '8' }} \
            --budget ${{ github.event.inputs.budget || '25' }}

      - name: 汇总
        if: always()
        run: |
          echo "## 重写结果" >> $GITHUB_STEP_SUMMARY
          if [ -f dist_rewrite/修复报告.md ]; then
            cat dist_rewrite/修复报告.md >> $GITHUB_STEP_SUMMARY
          else
            echo "没有生成报告，看看上面的日志。" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 失败书源重写结果
          path: dist_rewrite/
          retention-days: 30

      - name: 提交回仓库
        if: github.event.inputs.commit_result != 'false'
        run: |
          git config user.name  "zaka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dist_rewrite || true
          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit -m "书源重写结果 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
